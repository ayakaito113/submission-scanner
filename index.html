<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>提出物QR管理</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      margin: 0;
      background: #f5f6f8;
      color: #202124;
    }

    .wrap {
      max-width: 560px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 4px 0 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.07);
    }

    .types {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .type {
      padding: 16px 8px;
      border-radius: 12px;
      border: 2px solid #ddd;
      background: white;

      font-size: 17px;
      font-weight: bold;
      line-height: 1.3;
    }

    .type.active {
      background: #e8f0fe;
      border-color: #3367d6;
      color: #174ea6;
    }

    button.main {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;

      background: #3367d6;
      color: white;

      font-size: 18px;
      font-weight: bold;
    }

    button.secondary {
      width: 100%;

      border: 1px solid #ddd;
      border-radius: 10px;

      padding: 10px;
      margin-top: 10px;

      background: white;
      color: #555;
    }

    input {
      box-sizing: border-box;

      width: 100%;

      padding: 14px;

      border: 1px solid #bbb;
      border-radius: 10px;

      font-size: 16px;

      margin-bottom: 10px;
    }

    #reader {
      margin-top: 12px;
      width: 100%;
    }

    #status {
      font-size: 18px;
      font-weight: bold;

      white-space: pre-line;
      line-height: 1.5;
    }

    .ok {
      color: #137333;
    }

    .warn {
      color: #b06000;
    }

    .error {
      color: #b3261e;
    }

    .hidden {
      display: none;
    }
    .ratings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    #fixScore { width: auto; margin: 0 8px 0 0; }
    #scoreHint { margin: 10px 0; font-weight: bold; color: #174ea6; }

  </style>

</head>


<body>

<div class="wrap">

  <h1>
    提出物QR管理
  </h1>


  <!-- 管理キー -->

  <div
    class="card"
    id="keyCard"
  >

    <div
      style="
        font-weight:bold;
        margin-bottom:10px;
      "
    >
      🔐 管理キー
    </div>

    <input
      type="password"
      id="keyInput"
      placeholder="管理キーを入力"
    >

    <button
      class="main"
      id="saveKey"
    >
      保存して開始
    </button>

  </div>


  <!-- 提出物選択 -->

  <div
    class="card hidden"
    id="scannerArea"
  >

    <div
      style="
        font-weight:bold;
        margin-bottom:10px;
      "
    >
      受付の準備
    </div>

    <div style="font-weight:bold;margin:14px 0 10px;">クラスを選択</div>

    <div class="types" id="classes">
      <button class="type class active" data-class="3-1">3-1</button>
      <button class="type class" data-class="3-2">3-2</button>
    </div>

    <div style="font-weight:bold;margin:14px 0 10px;">提出物を選択</div>

    <div class="types" id="submissionTypes">

      <button
        class="type active"
        data-type="A"
      >
        視写
      </button>

      <button
        class="type"
        data-type="B"
      >
        音読
      </button>

      <button
        class="type"
        data-type="C"
      >
        ぴったりドリル
      </button>

      <button
        class="type"
        data-type="D"
      >
        算数ドリル
      </button>

    </div>

    <div style="font-weight:bold;margin:14px 0 10px;">完成度を選択</div>
    <div class="ratings" id="ratings" role="group" aria-label="完成度">
      <button class="type" data-score="3" aria-pressed="false">優秀<br>3点</button>
      <button class="type" data-score="2" aria-pressed="false">普通<br>2点</button>
      <button class="type" data-score="1" aria-pressed="false">不備あり<br>1点</button>
    </div>
    <p id="scoreHint" aria-live="polite">完成度を選んでからQRを読んでください。</p>
    <label><input id="fixScore" type="checkbox">評価を固定して続けて読む</label>
    <p style="font-size:13px;">通常は1人読むごとに評価が未選択に戻ります。</p>
    <button class="secondary" id="lateToggle">
      通常の提出（遅れて提出ではない）
    </button>

  </div>


  <!-- カメラ -->

  <div
    class="card hidden"
    id="cameraCard"
  >

    <button
      class="main"
      id="start"
    >
      📷 受付開始・QRスキャン
    </button>

    <div id="reader"></div>

  </div>


  <!-- 結果表示 -->

  <div
    class="card hidden"
    id="statusCard"
  >

    <div id="status">
      提出物を選んで
      QRスキャンを開始してください。
    </div>

  </div>


  <!-- 管理キー削除 -->

  <div
    class="card hidden"
    id="settingsCard"
  >

    <button
      class="secondary"
      id="forgetKey"
    >
      この端末の管理キーを削除
    </button>

  </div>

</div>


<script>


// ==================================================
// Apps Script Web API
// ==================================================

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbw7sdEXxDPwlx9KnL510wTAYsV9WZiab-14WEbiSHzBUsuaA905QomGp9bwCMgY4kNg/exec';


// ==================================================
// A〜D と画面表示名の対応
// ==================================================

const TYPE_LABELS = {

  A: '視写',

  B: '音読',

  C: 'ぴったりドリル',

  D: '算数ドリル'

};


// ==================================================

let selectedType = 'A';

let selectedClass = '3-1';
let selectedScore = null;
const SCORE_LABELS = {3: '優秀', 2: '普通', 1: '不備あり'};

function renderScore() {
  document.querySelectorAll('#ratings button').forEach(button => {
    const active = Number(button.dataset.score) === selectedScore;
    button.classList[active ? 'add' : 'remove']('active');
    button.setAttribute('aria-pressed', String(active));
  });
  document.getElementById('scoreHint').textContent = selectedScore
    ? SCORE_LABELS[selectedScore] + '：' + selectedScore + '点' +
      (document.getElementById('fixScore').checked ? '（固定中）' : '（次の1人）')
    : '完成度を選んでからQRを読んでください。';
}
function clearScoreContext() {
  selectedScore = null;
  document.getElementById('fixScore').checked = false;
  renderScore();
}
document.querySelectorAll('#ratings button').forEach(button => {
  button.addEventListener('click', () => {
    if (starting || locked || resultUncertain) return;
    selectedScore = Number(button.dataset.score);
    renderScore();
  });
});
document.getElementById('fixScore').addEventListener('change', () => {
  renderScore();
});

let sessionId = '';

let isLateSubmission = false;

let scanner = null;

let started = false;
let starting = false;
let blockedLateCode = '';

let locked = false;
let resultUncertain = false;

let lastCode = '';

let lastTime = 0;


// ==================================================
// ページ起動時
// ==================================================

window.addEventListener(
  'DOMContentLoaded',
  () => {

    const savedKey =
      localStorage.getItem(
        'qrApiKey'
      );

    if (savedKey) {

      showScanner();

    }

  }
);


// ==================================================
// 管理キー保存
// ==================================================

document
  .getElementById('saveKey')
  .addEventListener(
    'click',
    () => {

      const key =
        document
          .getElementById(
            'keyInput'
          )
          .value
          .trim();

      if (!key) {

        alert(
          '管理キーを入力してください。'
        );

        return;

      }

      localStorage.setItem(
        'qrApiKey',
        key
      );

      showScanner();

    }
  );


// ==================================================
// 管理キー削除
// ==================================================

document
  .getElementById('forgetKey')
  .addEventListener(
    'click',
    () => {

      localStorage.removeItem(
        'qrApiKey'
      );

      location.reload();

    }
  );


// ==================================================
// スキャナー画面表示
// ==================================================

function showScanner() {

  document
    .getElementById('keyCard')
    .classList.add(
      'hidden'
    );

  document
    .getElementById(
      'scannerArea'
    )
    .classList.remove(
      'hidden'
    );

  document
    .getElementById(
      'cameraCard'
    )
    .classList.remove(
      'hidden'
    );

  document
    .getElementById(
      'statusCard'
    )
    .classList.remove(
      'hidden'
    );

  document
    .getElementById(
      'settingsCard'
    )
    .classList.remove(
      'hidden'
    );

}


// ==================================================
// 提出物選択
// ==================================================

document
  .querySelectorAll('#submissionTypes .type')
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          if (starting || locked) return;
          clearScoreContext();
          blockedLateCode = '';
          document
            .querySelectorAll(
              '#submissionTypes .type'
            )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );

          button
            .classList.add(
              'active'
            );

          selectedType =
            button.dataset.type;

          showStatus(

            `${TYPE_LABELS[selectedType]}を選択中
QRを読み取ってください。`,

            ''

          );

        }
      );

    }
  );


// ==================================================
// クラス選択
// ==================================================

document
  .querySelectorAll('.class')
  .forEach(
    button => {
      button.addEventListener(
        'click',
        () => {
          if (starting || locked) return;
          clearScoreContext();
          blockedLateCode = '';
          document.querySelectorAll('.class').forEach(
            b => b.classList.remove('active')
          );
          button.classList.add('active');
          selectedClass = button.dataset.class;
        }
      );
    }
  );


// ==================================================
// 遅れて提出の切り替え
// ==================================================

document
  .getElementById('lateToggle')
  .addEventListener(
    'click',
    () => {
      if (starting || locked) return;
      isLateSubmission = !isLateSubmission;
      blockedLateCode = '';

      document
        .getElementById('lateToggle')
        .textContent =
        isLateSubmission
          ? '⚠️ 遅れて提出（同日に追加登録できます）'
          : '通常の提出（遅れて提出ではない）';
    }
  );


// ==================================================
// カメラ起動
// ==================================================

document
  .getElementById('start')
  .addEventListener(
    'click',
    async () => {

      if (started || starting || resultUncertain) {
        return;
      }
      starting = true;

      try {

        showStatus(
          `${selectedClass}：${TYPE_LABELS[selectedType]}の受付を開始しています…`,
          ''
        );

        sessionId =
          `${selectedClass}-${selectedType}-${Date.now()}-${Math.random()}`;

        const apiKey =
          localStorage.getItem('qrApiKey');

        const capabilityResponse = await fetch(GAS_URL, {
          method: 'POST', redirect: 'follow',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({action: 'capabilities', apiKey})
        });
        const capability = await readApiResponse(capabilityResponse, 'capabilities');
        if (!capability.ok || capability.scoringVersion !== 1 || !capability.scoringReady)
          throw new Error('GASの更新・新バージョンのデプロイと「完成度集計を準備」を完了してください。');

        scanner =
          new Html5Qrcode(
            'reader'
          );

        await scanner.start(

          {
            facingMode:
              'environment'
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },

          onScan,

          () => {}

        );

        if (!isLateSubmission) {
        const startResponse =
          await fetch(
            GAS_URL,
            {
              method: 'POST',
              redirect: 'follow',
              headers: {
                'Content-Type': 'text/plain;charset=utf-8'
              },
              body: JSON.stringify({
                action: 'startSession',
                className: selectedClass,
                submissionType: selectedType,
                sessionId: sessionId,
                apiKey: apiKey
              })
            }
          );

        const startResult =
          await readApiResponse(startResponse, 'session');

        if (!startResult.ok) {
          throw new Error(
            startResult.message || '受付を開始できません。'
          );
        }
        }
        started = true;

        document
          .getElementById(
            'start'
          )
          .style.display =
          'none';

        showStatus(

          `${TYPE_LABELS[selectedType]}を選択中
QRを読み取ってください。`,

          ''

        );

      }

      catch (error) {
        if (scanner) { try { await scanner.stop(); } catch (_) {} }

        showStatus(

          `❌ 受付を開始できません。
カメラの許可・通信・管理キーを確認してください。
${error.message || '端末でエラーが発生しました。'}`,

          'error'

        );

      }
      finally { starting = false; }

    }
  );


// ==================================================
// QR読み取り
// ==================================================

async function onScan(
  decodedText
) {

  const now =
    Date.now();

  if (locked || resultUncertain || !started || !selectedScore || decodedText === blockedLateCode) {
    return;
  }


  // 同じQRをカメラが連続認識するのを防ぐ
  if (

    decodedText === lastCode

    &&

    now - lastTime < 3000

  ) {

    return;

  }


  locked = true;

  lastCode =
    decodedText;

  lastTime =
    now;


  showStatus(

    '登録中…',

    ''

  );


  let submissionAttempted = false;
  try {

    const apiKey =
      localStorage.getItem(
        'qrApiKey'
      );

    const scanClass = selectedClass;
    const scanType = selectedType;
    const scanLate = isLateSubmission;
    const scanScore = selectedScore;
    if (!document.getElementById('fixScore').checked) {
      selectedScore = null;
      renderScore();
    }
    if (scanLate) blockedLateCode = decodedText;
    if (scanLate && !confirm(`${scanClass}・${TYPE_LABELS[scanType]}の遅れ提出を1回追加しますか？`)) {
      locked = false;
      return;
    }
    if (scanLate) {
      isLateSubmission = false;
      document.getElementById('lateToggle').textContent = '通常の提出（遅れて提出ではない）';
    }
    if (!scanLate) {
      const sessionResponse = await fetch(GAS_URL, {
        method: 'POST', redirect: 'follow',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action: 'startSession', className: scanClass,
          submissionType: scanType, sessionId: `${scanClass}-${scanType}-${Date.now()}`, apiKey})
      });
      const sessionResult = await readApiResponse(sessionResponse, 'session');
      if (!sessionResult.ok) throw new Error(sessionResult.message || '受付を開始できません。');
    }


    // これ以降の受信失敗は「未登録」とは断定できない。
    submissionAttempted = true;
    const response =
      await fetch(

        GAS_URL,

        {

          method: 'POST',

          redirect: 'follow',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              studentId:
                decodedText,

              className:
                scanClass,

              submissionType:
                scanType,

              apiKey:
                apiKey,

              isLateSubmission:
                scanLate,
              score: scanScore

            })

        }

      );


    const result =
      await readApiResponse(response, 'submission');


    // ==================================================
    // 登録成功
    // ==================================================

    if (result.ok) {

      const label =
        TYPE_LABELS[
          result.submissionType
        ];

      showStatus(

        `✅ ${result.name}さん
${result.className} ${result.number}番
${label}
完成度：${SCORE_LABELS[result.score]}（${result.score}点）
今回で ${result.count}回目`,

        'ok'

      );


      safeVibrate(80);

    }


    // ==================================================
    // 同日重複
    // ==================================================

    else if (
      result.duplicate
    ) {

      const label =
        TYPE_LABELS[
          result.submissionType
        ];

      showStatus(

        `⚠️ ${result.name}さん
今日は「${label}」を
すでに登録済みです。`,

        'warn'

      );


      safeVibrate([60, 50, 60]);

    }


    // ==================================================
    // 管理キー不一致
    // ==================================================

    else if (
      result.unauthorized
    ) {

      localStorage.removeItem(
        'qrApiKey'
      );

      alert(
        '管理キーが違います。もう一度入力してください。'
      );

      location.reload();

      return;

    }


    // ==================================================
    // その他エラー
    // ==================================================

    else {

      showStatus(

        `❌ ${result.message}`,

        'error'

      );

    }

  }


  catch (error) {

    // 応答本文・管理キー・児童情報をログへ出さない。
    resultUncertain = true;
    started = false;
    document.getElementById('start').style.display = 'none';
    showStatus(
      submissionAttempted
        ? '⚠️ 登録結果を確認できません。\nスプレッドシートには登録済みの可能性があります。\n重複を防ぐため読み取りを停止しました。\n提出履歴を確認し、登録済みなら送り直さないでください。\n確認後、ページを再読み込みして再開してください。'
        : '⚠️ 受付を確認できないため読み取りを停止しました。\n今回の児童の提出データは送っていません。\n通信・管理キーを確認してからページを再読み込みしてください。',
      'warn'
    );
    if (scanner) { try { await scanner.stop(); } catch (_) {} }
    return;

  }


  // 1秒後に次の児童を読み取り可能にする
  setTimeout(
    () => {

      locked = false;

    },

    1000
  );

}


// GAS以外のエラーページや空の返事を、登録結果として扱わない。
async function readApiResponse(response, kind) {
  if (!response.ok) throw new Error('サーバーから正常な返事を受け取れませんでした。');
  const body = await response.text();
  let result;
  try {
    result = JSON.parse(body.replace(/^\uFEFF/, '').trim());
  } catch (_) {
    throw new Error('サーバーの返事を読み取れませんでした。');
  }
  if (!result || typeof result !== 'object' || Array.isArray(result) ||
      typeof result.ok !== 'boolean') {
    throw new Error('サーバーの返事が想定した形式ではありません。');
  }
  if (kind === 'submission' && (result.ok || result.duplicate)) {
    if (typeof result.name !== 'string' || !TYPE_LABELS[result.submissionType] ||
        (result.ok && (typeof result.className !== 'string' ||
          !Number.isFinite(result.count) || result.count < 1 || result.number == null ||
          ![1,2,3].includes(result.score)))) {
      throw new Error('登録結果の情報が不足しています。');
    }
  }
  return result;
}

// 振動の非対応・端末側エラーで登録成功の表示を上書きしない。
function safeVibrate(pattern) {
  try {
    if (typeof navigator.vibrate === 'function') navigator.vibrate(pattern);
  } catch (_) {}
}

// ==================================================
// 結果表示
// ==================================================

function showStatus(
  text,
  type
) {

  const element =
    document.getElementById(
      'status'
    );

  element.textContent =
    text;

  element.className =
    type || '';

}


</script>

</body>

</html>
